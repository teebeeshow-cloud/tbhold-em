<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>The Beyond Show - Texas Hold'em</title>
    <!-- Import de la police Big Shoulders Display -->
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #09090b; color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1, h3 { font-family: 'Big Shoulders Display', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        h1 { color: #f59e0b; margin-bottom: 5px; font-size: 2.2rem; text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3); }
        .subtitle { color: #dc2626; font-size: 0.9rem; margin-bottom: 25px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        #auth-box, #table-container { background: #18181b; padding: 25px; border-radius: 12px; border: 2px solid #dc2626; box-shadow: 0 4px 25px rgba(220, 38, 38, 0.2); width: 100%; max-width: 600px; box-sizing: border-box; }
        .hidden { display: none !important; }
        
        input, button { padding: 12px 15px; border-radius: 6px; border: 1px solid #3f3f46; background: #09090b; color: #fff; font-size: 1rem; margin-top: 12px; width: 100%; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        input:focus { border-color: #f59e0b; outline: none; }
        
        button { background: #dc2626; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; font-family: 'Big Shoulders Display', sans-serif; font-size: 1.2rem; letter-spacing: 1px; }
        button:hover { background: #b91c1c; }
        button.success { background: #16a34a; }
        button.success:hover { background: #15803d; }
        button.gold { background: #f59e0b; color: #000; }
        button.gold:hover { background: #d97706; }

        .table-felt { background: #064e3b; border: 8px solid #065f46; outline: 3px solid #f59e0b; border-radius: 150px; padding: 30px; min-height: 280px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative; margin-top: 20px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
        .pot-display { background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 20px; font-weight: bold; color: #f59e0b; font-size: 1.2rem; border: 1px solid #f59e0b; font-family: 'Big Shoulders Display', sans-serif; letter-spacing: 1px; }
        .community-cards { display: flex; gap: 8px; }
        
        .card { background: #fff; color: #000; width: 38px; height: 54px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1rem; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }
        .card.H, .card.D { color: #dc2626; }

        .actions-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .status-log { background: #09090b; padding: 10px; border-radius: 6px; font-size: 0.95rem; color: #f59e0b; text-align: center; margin-bottom: 15px; border: 1px solid #3f3f46; font-weight: 600; }
        .my-hand { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
        .player-info { font-size: 0.85rem; color: #e4e4e7; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

    <h1>TB Poker Hold'em</h1>
    <div class="subtitle">The Beyond Show — Édition Live</div>

    <!-- ÉTAPE D'AUTHENTIFICATION SIMPLIFIÉE (PAR PSEUDO) -->
    <div id="auth-box">
        <h3 style="color: #f59e0b; margin-top: 0;">Connexion Joueur</h3>
        <p style="font-size: 0.85rem; color: #a1a1aa;">Entrez simplement votre pseudo. Plus besoin d'identifiant technique ! (Buy-in : 500 TB-Coins).</p>
        <input type="text" id="username-input" placeholder="Votre Pseudo (ex: TBSHOW)">
        <button class="gold" onclick="joinTable()">S'asseoir à la table (500 Coins)</button>
    </div>

    <!-- PLATEAU DE JEU -->
    <div id="table-container" class="hidden">
        <div class="status-log" id="log-msg">En attente de joueurs...</div>
        
        <div class="table-felt">
            <div class="pot-display">Pot : <span id="pot-val">0</span> TB-Coins</div>
            <div class="community-cards" id="community-box">
                <div class="card">-</div><div class="card">-</div><div class="card">-</div><div class="card">-</div><div class="card">-</div>
            </div>
            <div class="player-info" id="table-players-info">Chargement des joueurs...</div>
        </div>

        <div style="text-align: center; margin-top: 15px; font-size: 0.9rem; color: #f59e0b; font-family: 'Big Shoulders Display'; letter-spacing: 1px;">Vos cartes privées :</div>
        <div class="my-hand" id="my-cards-box">
            <div class="card">-</div><div class="card">-</div>
        </div>

        <div class="actions-bar" id="controls-box">
            <button style="background: #7f1d1d;" onclick="sendAction('fold')">Se coucher</button>
            <button class="success" onclick="sendAction('call')">Parole / Suivre</button>
            <button class="gold" onclick="sendAction('raise')">Relancer (+20)</button>
        </div>

        <button style="margin-top: 20px; background: #27272a; border: 1px solid #f59e0b;" onclick="startHand()">[Admin] Lancer la main</button>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            databaseURL: "https://tb-holdem-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const WORKER_URL = "https://tb-poker-dealer.teebeeshow.workers.dev";
        let myUid = "";
        let myUsername = "";
        const tableId = "table_1";

        function joinTable() {
            myUsername = document.getElementById("username-input").value.trim();
            if(!myUsername) return alert("Entrez un pseudo !");
            
            // Transformation propre du pseudo en UID unique (suppression des espaces/accents)
            myUid = "user_" + myUsername.toLowerCase().replace(/[^a-z0-9]/g, "");

            fetch(`${WORKER_URL}/join`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ uid: myUid, username: myUsername, tableId })
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) alert(data.error);
                else {
                    document.getElementById("auth-box").classList.add("hidden");
                    document.getElementById("table-container").classList.remove("hidden");
                    initListeners();
                }
            })
            .catch(err => alert("Erreur réseau : " + err));
        }

        function initListeners() {
            db.ref(`poker_public/${tableId}`).on("value", snapshot => {
                const data = snapshot.val();
                if(!data) return;

                document.getElementById("pot-val").innerText = data.pot || 0;
                document.getElementById("log-msg").innerText = data.lastAction || "Partie en cours...";

                const commBox = document.getElementById("community-box");
                commBox.innerHTML = "";
                if(data.communityCards && data.communityCards.length > 0) {
                    data.communityCards.forEach(c => {
                        commBox.innerHTML += `<div class="card ${c[1]}">${c[0]}${c[1]}</div>`;
                    });
                } else {
                    for(let i=0; i<5; i++) commBox.innerHTML += `<div class="card" style="opacity: 0.3;">-</div>`;
                }

                let infoTxt = "";
                if(data.players) {
                    Object.entries(data.players).forEach(([id, p]) => {
                        const isTurn = data.turnUid === id ? "⭐ [TOUR]" : "";
                        infoTxt += `${p.username} (${p.chips} 🪙) - Mise: ${p.bet} ${p.folded ? '[couché]' : ''} ${isTurn} | `;
                    });
                }
                document.getElementById("table-players-info").innerText = infoTxt;

                const isMyTurn = data.turnUid === myUid;
                document.getElementById("controls-box").style.opacity = isMyTurn ? "1" : "0.4";
            });

            db.ref(`poker_private/${tableId}/${myUid}`).on("value", snapshot => {
                const data = snapshot.val();
                const handBox = document.getElementById("my-cards-box");
                handBox.innerHTML = "";
                if(data && data.cards) {
                    data.cards.forEach(c => {
                        handBox.innerHTML += `<div class="card ${c[1]}">${c[0]}${c[1]}</div>`;
                    });
                } else {
                    handBox.innerHTML = `<div class="card">-</div><div class="card">-</div>`;
                }
            });
        }

        function sendAction(action) {
            let amount = 0;
            if(action === 'raise') {
                amount = prompt("Montant total de la relance :", "40");
                if(!amount) return;
            }
            fetch(`${WORKER_URL}/action`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ uid: myUid, tableId, action, amount: Number(amount) })
            }).then(res => res.json()).then(data => {
                if(data.error) alert(data.error);
            });
        }

        function startHand() {
            fetch(`${WORKER_URL}/start`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tableId })
            }).then(res => res.json()).then(data => {
                if(data.error) alert(data.error);
            });
        }
    </script>
</body>
</html>
