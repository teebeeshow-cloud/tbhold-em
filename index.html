<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BEYOND ODYSSEY — Zodiac Expedition Wheel (TB SHOW B2B)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070709;
            --card-bg: #111116;
            --gold: #d4af37;
            --gold-bright: #ffae00;
            --tb-red: #dc2626;
            --tb-red-dark: #990000;
            --kick-green: #53fc18;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top, #1c0909 0%, var(--bg-dark) 75%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px 15px 60px;
            min-height: 100vh;
            text-align: center;
        }

        /* === TITLE SPONSOR HEADER BAR === */
        .title-sponsor-bar {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            background: linear-gradient(90deg, rgba(153, 0, 0, 0.4), rgba(220, 38, 38, 0.2), rgba(153, 0, 0, 0.4));
            border: 1px dashed var(--gold);
            border-radius: 8px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .sponsor-badge {
            background: var(--gold-bright);
            color: #070709;
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .sponsor-text {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        .sponsor-cta {
            background: transparent;
            border: 1px solid var(--gold-bright);
            color: var(--gold-bright);
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 6px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }

        .sponsor-cta:hover {
            background: var(--gold-bright);
            color: #070709;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 25px auto;
            padding-bottom: 16px;
            border-bottom: 3px solid var(--tb-red);
            box-shadow: 0 4px 30px -10px var(--tb-red);
        }

        h1 {
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            letter-spacing: 4px;
            color: var(--gold-bright);
            text-shadow: 0 0 25px rgba(255, 174, 0, 0.5), 0 2px 5px #000;
            margin: 0 0 4px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--tb-red);
            margin: 0;
        }

        /* === MAIN LAYOUT GRID === */
        .main-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel-card {
            background: linear-gradient(145deg, #13131a, var(--card-bg));
            border: 1px solid var(--gold);
            border-top: 4px solid var(--gold-bright);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), inset 0 0 20px rgba(212, 175, 55, 0.06);
        }

        .panel-title {
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--gold-bright);
            text-transform: uppercase;
            margin: 0 0 16px 0;
        }

        /* === WHEEL CONTAINER === */
        .wheel-wrapper {
            position: relative;
            width: 420px;
            height: 420px;
            margin: 15px auto 20px auto;
        }

        @media (max-width: 480px) {
            .wheel-wrapper {
                width: 310px;
                height: 310px;
            }
            canvas {
                width: 310px;
                height: 310px;
            }
        }

        canvas {
            border-radius: 50%;
            border: 5px solid var(--gold);
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.4), 0 0 25px rgba(212, 175, 55, 0.4);
            background: var(--bg-dark);
            display: block;
            margin: 0 auto;
        }

        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 36px solid var(--gold-bright);
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.9));
        }

        .wheel-center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--tb-red-dark) 0%, #070709 90%);
            border: 2px solid var(--gold-bright);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 174, 0, 0.6);
            z-index: 5;
            pointer-events: none;
        }

        .wheel-center-hub span {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 11px;
            font-weight: 900;
            color: var(--gold-bright);
            letter-spacing: 1.5px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            color: #070709;
            border: none;
            padding: 15px 32px;
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 22px rgba(255, 174, 0, 0.45);
            width: 100%;
        }

        .btn-spin:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(255, 174, 0, 0.7);
        }

        .btn-spin:disabled {
            background: #1f2330;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* === RESULT & STAGE SPONSOR BOX === */
        .result-box {
            text-align: left;
        }

        .zodiac-tag {
            display: inline-block;
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid var(--tb-red);
            color: #ff8080;
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 4px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .dest-name {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold-bright);
            margin: 0 0 8px 0;
            line-height: 1.1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .dest-pitch {
            font-size: 13.5px;
            color: #cbd5e1;
            line-height: 1.6;
            margin: 0 0 18px 0;
        }

        .ad-slot-stage {
            background: rgba(7, 7, 9, 0.85);
            border: 1px dashed var(--tb-red);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .ad-slot-label {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ff8080;
            margin-bottom: 6px;
            display: block;
        }

        .ad-slot-target {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .ad-slot-desc {
            font-size: 12px
